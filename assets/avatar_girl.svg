<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#fce7f3" stroke="#f472b6" stroke-width="3"/>
  
  <!-- Blouse & Red Scarf -->
  <path d="M 22 92 C 24 72 38 68 50 68 C 62 68 76 72 78 92 Z" fill="#ffffff"/>
  <!-- Red Scarf (Khăn quàng đỏ) -->
  <path d="M 38 70 Q 50 78 62 70 L 58 84 Q 50 88 42 84 Z" fill="#ef4444"/>
  <polygon points="50,78 46,92 50,96 54,92" fill="#dc2626"/>
  
  <!-- Neck -->
  <rect x="44" y="58" width="12" height="14" rx="4" fill="#fed7aa"/>
  
  <!-- Pigtails Behind -->
  <ellipse cx="22" cy="46" rx="8" ry="14" fill="#1e293b"/>
  <ellipse cx="78" cy="46" rx="8" ry="14" fill="#1e293b"/>
  <!-- Red Ribbons -->
  <circle cx="26" cy="40" r="4" fill="#ef4444"/>
  <circle cx="74" cy="40" r="4" fill="#ef4444"/>
  
  <!-- Head & Face -->
  <ellipse cx="50" cy="42" rx="21" ry="23" fill="#ffedd5"/>
  <ellipse cx="28" cy="44" rx="3.5" ry="6" fill="#fed7aa"/>
  <ellipse cx="72" cy="44" rx="3.5" ry="6" fill="#fed7aa"/>
  
  <!-- Cheeks -->
  <ellipse cx="36" cy="48" rx="4.5" ry="3" fill="#f472b6" opacity="0.6"/>
  <ellipse cx="64" cy="48" rx="4.5" ry="3" fill="#f472b6" opacity="0.6"/>
  
  <!-- Eyes -->
  <ellipse cx="39" cy="40" rx="3.5" ry="4.5" fill="#1e293b"/>
  <ellipse cx="61" cy="40" rx="3.5" ry="4.5" fill="#1e293b"/>
  <circle cx="40.5" cy="38.5" r="1.5" fill="#ffffff"/>
  <circle cx="62.5" cy="38.5" r="1.5" fill="#ffffff"/>
  <!-- Lashes -->
  <path d="M 36 37 L 34 35 M 64 37 L 66 35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M 43 49 Q 50 56 57 49" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bangs / Hair Front -->
  <path d="M 28 36 C 26 20 36 16 50 16 C 64 16 74 20 72 36 C 68 28 62 26 50 26 C 38 26 32 28 28 36 Z" fill="#1e293b"/>
  <path d="M 42 26 Q 50 32 58 26" stroke="#1e293b" stroke-width="3" fill="none"/>
</svg>
